name: Nix build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://vladexa.cachix.org
            extra-trusted-public-keys = vladexa.cachix.org-1:ThmpOQRxh92xt3RMgUA5XOEklLhW1pLQa5lPTREozO4=

      - name: Build
        run: nix build --print-build-logs

      - name: Smoke test
        run: ./result/bin/nix-pr-patches

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: result/bin/nix-pr-patches
